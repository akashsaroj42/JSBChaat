# Default profile is h2 for local testing without database installation.
# Switch to mysql for production/local MySQL by changing to 'mysql' or running with -Dspring.profiles.active=mysql
spring.profiles.active=h2

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Settings (Override via env variables in production)
jwt.secret=9a67637371727777787980818283848586878889909192939495969798990000
jwt.expiration-ms=86400000

# Cloudinary Config (Fill in to use Cloudinary, otherwise local fallback is used)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Local Upload directory fallback (will be created in current execution path)
upload.local-dir=uploads
